<svg xmlns="http://www.w3.org/2000/svg" width="420" height="88" viewBox="0 0 420 88" role="img" aria-label="Xinge Xu"><title>Xinge Xu</title><style>
.letters path { animation: shimmer 6s ease-in-out infinite; }
.letters path:nth-child(2n) { animation-delay: .15s; }
.letters path:nth-child(3n) { animation-delay: .3s; }
@keyframes shimmer { 0%, 65%, 100% { fill: #a17ac4; } 78% { fill: #d7a7ea; } }
.spark { animation: twinkle 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { .letters path, .spark { animation: none; } }
